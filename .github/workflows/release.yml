name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.4.0 — no leading v)'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Build zip
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: php build.php

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: |
            Built from `${{ github.ref_name }}` by GitHub Actions.

            ## Install

            1. Download `paneldns-reseller-whmcs-${{ steps.version.outputs.VERSION }}.zip`
            2. Extract into your WHMCS root — the `modules/` folder merges cleanly
            3. See [INSTALL.md](https://github.com/Veeau/paneldns-reseller-whmcs/blob/${{ github.ref_name }}/INSTALL.md) for full setup

            ## What changed

            See [CHANGELOG.md](https://github.com/Veeau/paneldns-reseller-whmcs/blob/${{ github.ref_name }}/CHANGELOG.md)
