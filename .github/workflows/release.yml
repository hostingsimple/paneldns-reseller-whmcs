name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build zip
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p dist
          zip -r dist/paneldns-reseller-whmcs-${VERSION}.zip \
            modules/ \
            shared/ \
            -x "*.git*" "*.DS_Store"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: |
            Built from `${{ github.ref_name }}` by GitHub Actions.

            ## Downloads

            - **paneldns-reseller-whmcs** — install on your WHMCS to provision sub-client DNS accounts

            See [CHANGELOG.md](https://github.com/Veeau/paneldns-reseller-whmcs/blob/${{ github.ref_name }}/CHANGELOG.md) for what changed.
